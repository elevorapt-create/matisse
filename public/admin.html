<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Matisse | CRM</title><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head><body><main><section id="login" class="admin-login"><p class="eyebrow">MATISSE · ÁREA RESERVADA</p><h1>Bem-vinda ao<br>seu espaço.</h1><form id="login-form"><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="button">Entrar no CRM</button></form><p id="login-status" role="status"></p><a class="quiet" href="/">Voltar ao website</a></section><section id="crm" class="admin-shell" hidden><header class="admin-head"><div><p class="eyebrow">MATISSE · RELAÇÕES QUE TRANSFORMAM</p><h1>O seu acompanhamento comercial.</h1></div><button id="logout" class="button secondary">Terminar sessão</button></header><p id="crm-status" role="status"></p><div id="stats" class="stats"></div><div id="groups" class="admin-grid"></div><div class="filters"><input id="search" type="search" aria-label="Pesquisar leads" placeholder="Pesquisar por nome, e-mail ou serviço"><select id="status-filter" aria-label="Filtrar por estado"><option value="">Todos os estados</option></select><button id="refresh" class="button secondary">Atualizar</button></div><p class="fine" id="lead-count"></p><div class="table-scroll"><table><thead><tr><th scope="col">Cliente</th><th scope="col">Pedido</th><th scope="col">Origem</th><th scope="col">Estado</th><th scope="col">Detalhes</th></tr></thead><tbody id="leads"></tbody></table></div></section></main></body></html>
